[project]
name = "papertrail-pdf-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "PyMuPDF==1.26.3",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
# 位图页编辑（扫描件/截图）。onnxruntime + opencv 体积可观，
# 不需要这条路径时可以不装，相关接口会返回 503。
raster = [
  "rapidocr-onnxruntime>=1.4",
  "opencv-python-headless>=4.10",
  "pillow>=11",
  "numpy>=2",
]

[dependency-groups]
dev = ["pytest==8.4.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

